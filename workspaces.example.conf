# Workspaces for build-combined.sh: one rail button per line.
#
# Copy to workspaces.conf (gitignored) and edit:
#   cp workspaces.example.conf workspaces.conf
#
# Format, one workspace per line, fields separated by "|":
#
#   name | url | icon | store-uuid
#
#   name        Rail label and window title.
#   url         Start page.
#   icon        Optional PNG logo. Relative paths resolve against this file's
#               directory; ~/ works. Empty -> the rail shows the name's
#               first letter.
#   store-uuid  Optional. The workspace's isolated data store (its login).
#               Default: derived from the name. Either way it must stay
#               constant across rebuilds or that workspace's login resets.
#
# Each workspace gets its own isolated login, so two lines can point at the
# same URL with different Google accounts.

Work     | https://chat.google.com/
Personal | https://chat.google.com/

# With a logo and an explicit store UUID:
# Acme     | https://chat.google.com/ | icons/acme.png | 3F2504E0-4F89-41D3-9A0C-0305E82C3301
